\section*{Abstract}
This document provides the corrected YAML configuration for a GitHub Actions workflow named "Update Stats". The original workflow failed due to a non-fast-forward push error. The issue is resolved by adding a step to pull the latest changes from the remote repository before generating new files and committing them. This ensures the local branch is synchronized with the remote, preventing push rejections.

\section*{Corrected Workflow: \texttt{update\_stats.yml}}
The following code block contains the complete and corrected version of the workflow file. A new step, "Pull latest changes", has been added after the checkout step to synchronize the local repository with the remote \texttt{main} branch.

\begin{lstlisting}[caption={Corrected update\_stats.yml}, label={lst:workflow}]
name: Update Stats

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for all branches and tags
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stats SVG
        run: |
          npm install
          npm run start
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changes exist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Update contribution stats SVG"
          file_pattern: generated/total-stars.svg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

\end{lstlisting}

